{% extends 'base.html' %}{% block title %}Choose a new password{% endblock %}{% block robots %}noindex{% endblock %}
{% block body %}<section class="section"><div class="container xnarrow"><div class="card pad-lg"><h1 style="font-size:1.5rem">Choose a new password</h1>
<form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><div class="field"><label for="pw">New password</label><input id="pw" type="password" name="password" minlength="10" autocomplete="new-password" required></div><button class="btn btn-primary btn-block">Update password</button></form></div></div></section>{% endblock %}
