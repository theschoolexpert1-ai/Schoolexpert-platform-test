{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block robots %}noindex{% endblock %}
{% block body %}
<section class="section"><div class="container xnarrow">
  <div class="card pad-lg">
    <h1 style="font-size:1.6rem">Log in</h1>
    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">{% if nxt %}<input type="hidden" name="next" value="{{ nxt }}">{% endif %}
      <div class="field"><label for="email">Email</label><input id="email" type="email" name="email" value="{{ email }}" autocomplete="username" required autofocus></div>
      <div class="field"><label for="pw">Password</label><input id="pw" type="password" name="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary btn-block btn-lg">Log in</button>
    </form>
    <p class="small" style="margin-top:12px"><a href="{{ url_for('auth.forgot') }}">Forgot password?</a></p>
    <hr style="border:0;border-top:1px solid var(--line)">
    <p class="center small">New to The School Expert™? <a href="{{ url_for('auth.signup', next=nxt) }}">Create a free account</a></p>
  </div>
</div></section>
{% endblock %}
