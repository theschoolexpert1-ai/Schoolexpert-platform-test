{% extends 'admin/_layout.html' %}{% block title %}{{ a.title }}{% endblock %}
{% block admin %}<h1 style="font-size:1.5rem">{{ a.title }} — photos</h1><form method="post" enctype="multipart/form-data" class="card" style="margin-bottom:14px"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><div class="field"><label>Photos</label><input type="file" name="photos" multiple accept="image/*"></div><div class="field"><label>Caption</label><input name="caption"></div>
<label class="consent-box"><input type="checkbox" name="consent_confirmed"><span>No child is identifiable in these photos, or written parental consent is on file. Adults pictured were informed photos may be published.</span></label><button class="btn btn-primary" style="margin-top:10px">Upload</button></form>
<div class="gallery">{% for p in photos %}<div><img src="{{ p.url }}" alt=""><form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><input type="hidden" name="delete" value="{{ p.id }}"><button class="btn btn-ghost btn-sm">Remove</button></form></div>{% endfor %}</div>{% endblock %}
