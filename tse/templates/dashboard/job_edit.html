{% extends 'dashboard/_layout.html' %}{% block title %}{{ 'Edit job' if j.id else 'Create job listing' }}{% endblock %}
{% block dash %}<h1 style="font-size:1.5rem">{{ 'Edit job' if j.id else 'Create job listing' }}</h1>
<form method="post" class="card pad-lg"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="field"><label>Job title <span class="req">*</span></label><input name="title" value="{{ j.title or '' }}" required placeholder="e.g. TGT Mathematics (CBSE)"></div>
  <div class="row3"><div class="field"><label>Role</label><select name="role">{% for r in ['Pre-primary Teacher','Primary Teacher (PRT)','Trained Graduate Teacher (TGT)','Post Graduate Teacher (PGT)','Special Educator','Counsellor','Coordinator','Vice Principal','Principal','Librarian','Sports Coach','Other'] %}<option {% if j.role == r %}selected{% endif %}>{{ r }}</option>{% endfor %}</select></div>
    <div class="field"><label>Employment type</label><select name="employment_type">{% for t in ['Full-time','Part-time','Contract','Online / Remote','Substitute / Visiting'] %}<option {% if j.employment_type == t %}selected{% endif %}>{{ t }}</option>{% endfor %}</select></div>
    <div class="field"><label>Board</label><input name="board" value="{{ j.board or '' }}" placeholder="CBSE / ICSE / State / IB"></div></div>
  <div class="row2"><div class="field"><label>Subjects (comma separated)</label><input name="subjects" value="{{ (j.subjects or []) | join(', ') }}"></div><div class="field"><label>Grades (comma separated)</label><input name="grades" value="{{ (j.grades or []) | join(', ') }}"></div></div>
  <div class="row2"><div class="field"><label>Experience required</label><input name="experience" value="{{ j.experience or '' }}"></div><div class="field"><label>Qualifications</label><input name="qualifications" value="{{ j.qualifications or '' }}" placeholder="e.g. B.Ed., CTET"></div></div>
  <div class="row3"><div class="field"><label>Campus</label><select name="listing_id">{% for l in listings %}<option value="{{ l.id }}" {% if j.listing_id == l.id %}selected{% endif %}>{{ l.name }} — {{ l.city }}</option>{% endfor %}</select></div>
    <div class="field"><label>City</label><input name="city" value="{{ j.city or (listings[0].city if listings else '') }}"></div><div class="field"><label>State</label><select name="state">{% for s in states %}<option {% if s == (j.state or (listings[0].state if listings else '')) %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div></div>
  <div class="row3"><div class="field"><label>Salary from (₹/month)</label><input name="salary_min" inputmode="numeric" value="{{ j.salary_min or '' }}"></div><div class="field"><label>Salary to (₹/month)</label><input name="salary_max" inputmode="numeric" value="{{ j.salary_max or '' }}"></div><div class="field"><label>Apply by</label><input type="date" name="closes_on" value="{{ j.closes_on or '' }}"></div></div>
  <label class="opt"><input type="checkbox" name="show_salary" {% if j.show_salary %}checked{% endif %}> Show salary on the job post</label>
  <div class="field"><label>Description <span class="req">*</span></label><textarea name="description" required style="min-height:180px">{{ j.description or '' }}</textarea></div>
  <div class="btn-row"><button class="btn btn-outline" name="action" value="draft">Save for later</button><button class="btn btn-accent" name="action" value="publish">{{ 'Save & keep published' if j.status == 'published' else 'Publish now' }}</button>{% if j.status == 'published' %}<button class="btn btn-danger" name="action" value="close">Close job</button>{% endif %}</div>
</form>{% endblock %}
