# /etc/nginx/sites-available/schoolexpert  (then: ln -s ../sites-available/schoolexpert /etc/nginx/sites-enabled/)
# Security at the edge: TLS 1.2/1.3 only, HSTS, rate limits, request limits, basic attack filtering, no server banner.

# ---- put these two blocks in /etc/nginx/conf.d/tse-limits.conf (http context) ----
# limit_req_zone $binary_remote_addr zone=tse_general:20m rate=20r/s;
# limit_req_zone $binary_remote_addr zone=tse_auth:10m   rate=10r/m;
# limit_req_zone $binary_remote_addr zone=tse_api:20m    rate=10r/s;
# limit_conn_zone $binary_remote_addr zone=tse_conn:10m;
# server_tokens off;
# map $http_user_agent $tse_bad_ua { default 0; ~*(sqlmap|nikto|nmap|masscan|zgrab|acunetix|nessus|wpscan|dirbuster|gobuster) 1; }

server {
    listen 80;
    server_name schoolexpert.in www.schoolexpert.in registration.schoolexpert.in;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://www.schoolexpert.in$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name schoolexpert.in;
    include /etc/nginx/snippets/tse-tls.conf;
    return 301 https://www.schoolexpert.in$request_uri;
}
server {
    listen 443 ssl http2;
    server_name www.schoolexpert.in;
    include /etc/nginx/snippets/tse-tls.conf;

    client_max_body_size 20m;
    client_body_timeout 30s; client_header_timeout 15s; keepalive_timeout 30s; send_timeout 30s;
    limit_conn tse_conn 40;
    gzip on; gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    if ($tse_bad_ua) { return 403; }
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }
    location ~ /\.(?!well-known) { deny all; }                       # .env, .git, etc.
    location ~* \.(php|asp|aspx|jsp|cgi|sh|sql|bak|old|swp)$ { return 404; }   # probes for other platforms
    location ~* (\.\./|%2e%2e|etc/passwd|/proc/self) { return 400; }

    location /static/ { alias /var/www/schoolexpert/tse/static/; expires 30d; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff; }
    location /media/  {
        alias /var/www/schoolexpert/var/uploads/; expires 30d;
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; sandbox";
        location ~* \.(html?|svg|xml|js)$ { return 404; }             # uploads can never be served as active content
    }
    # Private uploads (IDs, certificates, CVs) are NEVER served by nginx — only via the app's authorised /private-file route.

    location ~ ^/(login|signup|forgot-password|reset-password|reauth|login/verify|api/v1/auth) {
        limit_req zone=tse_auth burst=10 nodelay;
        include /etc/nginx/snippets/tse-proxy.conf;
    }
    location /api/ { limit_req zone=tse_api burst=40 nodelay; include /etc/nginx/snippets/tse-proxy.conf; }
    location /admin {
        # Optional: allow only office / VPN addresses to reach the back office (also enforced in the app: ADMIN_IP_ALLOWLIST)
        # allow 203.0.113.10; allow 198.51.100.0/24; deny all;
        limit_req zone=tse_general burst=40 nodelay;
        include /etc/nginx/snippets/tse-proxy.conf;
    }
    location / { limit_req zone=tse_general burst=80 nodelay; include /etc/nginx/snippets/tse-proxy.conf; }
}
# Old registration site → new Registration Centre (form slugs are identical)
server {
    listen 443 ssl http2;
    server_name registration.schoolexpert.in;
    include /etc/nginx/snippets/tse-tls.conf;
    rewrite ^/forms/(.*)$ https://www.schoolexpert.in/register/$1 permanent;
    rewrite ^/faq$ https://www.schoolexpert.in/faq permanent;
    rewrite ^/privacy-policy$ https://www.schoolexpert.in/privacy-policy permanent;
    rewrite ^/contact-us$ https://www.schoolexpert.in/contact permanent;
    return 301 https://www.schoolexpert.in/register;
}
